[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Command line options
addopts =
    --verbose
    --color=yes
    --strict-markers
    --tb=short

# Markers for organizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests across modules
    gui: Tests requiring wx.App (GUI components)
    slow: Tests that take significant time

# Suppress third-party warnings not actionable in our code
filterwarnings =
    ignore:builtin type .* has no __module__:DeprecationWarning
    ignore:unclosed database:ResourceWarning

# Coverage settings (optional - run with --cov=app)
# addopts includes --cov=app --cov-report=html --cov-report=term-missing
