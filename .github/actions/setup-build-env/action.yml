name: Setup Build Environment
description: Install Python, uv, system deps, and project dependencies

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - uses: astral-sh/setup-uv@v6

    - name: Install system dependencies
      run: brew install tesseract leptonica pkg-config lcov
      shell: bash

    - name: Install project dependencies
      run: uv sync
      shell: bash

    - name: Install pyright
      run: pipx install pyright
      shell: bash
