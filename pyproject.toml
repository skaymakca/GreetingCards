[project]
name = "greeting-cards"
version = "0.8.0"
description = "macOS app for organizing and renaming greeting card PDFs using OCR and AI"
requires-python = ">=3.14"
dependencies = [
    "anthropic==0.83.0",
    "pillow==12.1.1",
    "PyMuPDF==1.27.1",
    "pytesseract==0.3.13",
    "pyobjc-framework-Cocoa==12.1",
    "SQLAlchemy==2.0.46",
    "wxPython==4.2.5",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "pytest-xdist==3.8.0",
    "pytest-watch==4.2.0",
    "pytest-asyncio==1.3.0",
    "pyinstaller>=6.0",
    "jinja2>=3.1.6",
    "markdown>=3.10.2",
    "tomli-w>=1.2.0",
    "opencv-python-headless>=4.13.0.92",
    "tesserocr>=2.10.0",
    "mypy>=1.19.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--color=yes",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Unit tests for individual functions",
    "integration: Integration tests across modules",
    "gui: Tests requiring wx.App (GUI components)",
    "slow: Tests that take significant time",
]
filterwarnings = [
    "ignore:builtin type .* has no __module__:DeprecationWarning",
    "ignore:unclosed database:ResourceWarning",
]
