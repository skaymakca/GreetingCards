# License configuration — manually maintained
# Run `make licenses-sync` after editing this file
#
# [[system]]  — seeds for deps not in uv.lock
# [[package]] — overrides for auto-discovered fields (non-empty fields win)
# exclude     — list of package names to skip (e.g. platform-specific deps)

# --- Excluded packages (not installable on macOS ARM) ---

exclude = [
    "pefile",           # Windows-only (sys_platform == 'win32')
    "pywin32-ctypes",   # Windows-only (sys_platform == 'win32')
    "greenlet",         # Not on macOS ARM (platform_machine marker)
]

# --- System dependencies (not in uv.lock) ---

[[system]]
slug = "python"
display = "Python"
version = "3.14"
license_type = "PSF License 2.0"
notes = "Bundled via PyInstaller"
url = "https://python.org"

[[system]]
slug = "tesseract"
display = "Tesseract OCR"
license_type = "Apache 2.0"
notes = "Bundled via tesserocr (library, data files, and transitive dependencies)"
url = "https://github.com/tesseract-ocr/tesseract"

[[system]]
slug = "leptonica"
display = "Leptonica"
license_type = "BSD-2-Clause"
notes = "Bundled as transitive dependency of tesserocr"
url = "https://github.com/DanBloomberg/leptonica"

